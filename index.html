<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070511"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>QuestLife</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#05040c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}#app{width:min(100%,480px);min-height:100vh;margin:auto;background:radial-gradient(circle at 85% 5%,#3c146d55,transparent 28%),linear-gradient(160deg,#090614,#060916 55%,#100719);padding-bottom:88px}header{padding:calc(18px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3;background:#080611cc;backdrop-filter:blur(18px)}.logo{font-size:27px;font-weight:950;font-style:italic;background:linear-gradient(90deg,#bd72ff,#39caff);-webkit-background-clip:text;color:transparent}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#17102d;border:1px solid #9c62ff88}.content{padding:8px 16px}.hero,.panel{padding:19px;border-radius:24px;border:1px solid #403060;background:linear-gradient(145deg,#1b1237dd,#0b1829dd);box-shadow:0 18px 45px #0007}.levelrow{display:flex;justify-content:space-between;align-items:end}.kicker,.muted{font-size:11px;color:#9994ae}.level{font-size:29px;font-weight:900;margin-top:3px}.xp{color:#ffd85a;font-weight:900}.bar{height:10px;border-radius:99px;background:#28233e;margin:14px 0;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#8a42ff,#35d2ff)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{text-align:center;padding:8px 3px;border-radius:14px;background:#ffffff08}.stat b{display:block;font-size:17px}.stat small{font-size:8px;color:#9994ae}h2,.title{font-size:20px;margin:22px 3px 10px}.title{font-size:30px;font-weight:950}.quest{display:flex;align-items:center;gap:10px;padding:13px;margin:8px 0;border-radius:18px;background:#101224dd;border:1px solid #282744}.quest.done{opacity:.45}.qicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#171b3a;font-size:22px}.qmain{flex:1}.qname{font-weight:850;font-size:14px}.qxp{color:#ffd65b;font-size:11px;font-weight:900}.check{width:36px;height:36px;border-radius:12px;border:1px solid #4d3c72;background:#18142a;color:#b46cff;font-size:18px}.add{width:100%;padding:15px;border:0;border-radius:17px;background:linear-gradient(100deg,#7137e8,#b33cff);font-weight:900;color:white;margin-top:8px}nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:78px;display:grid;grid-template-columns:repeat(4,1fr);background:#080711ee;backdrop-filter:blur(20px);border-top:1px solid #29243c}.nav{display:grid;place-items:center;color:#77738b;font-size:10px}.nav b{font-size:21px;display:block}.active{color:#bb72ff}.achievement{display:flex;align-items:center;gap:13px;margin-bottom:10px}.lock{margin-left:auto}.profile{text-align:center;padding:30px}.big{font-size:65px}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:end}.sheet{width:min(480px,100%);margin:auto;background:#111025;border-radius:26px 26px 0 0;padding:23px}.input{width:100%;padding:14px;margin:6px 0;border:1px solid #302a4a;background:#090917;color:white;border-radius:13px}.cancel{width:100%;background:transparent;border:0;padding:14px;color:#999}.toast{position:fixed;z-index:30;bottom:95px;left:50%;transform:translateX(-50%);background:#171229;border:1px solid #7248a4;padding:12px 18px;border-radius:15px;font-weight:850;display:none;white-space:nowrap}</style></head><body><div id="app"><header><div class="logo">QUESTLIFE</div><div class="avatar">🧙</div></header><main class="content" id="main"></main><nav><div class="nav active" data-t="home"><b>⌂</b>Home</div><div class="nav" data-t="quests"><b>⚔</b>Quests</div><div class="nav" data-t="ach"><b>🏆</b>Awards</div><div class="nav" data-t="profile"><b>◉</b>Profiel</div></nav><div class="modal" id="modal"><div class="sheet"><h2>✨ Nieuwe sidequest</h2><input class="input" id="qn" placeholder="Naam van quest"><input class="input" id="qx" type="number" value="50" placeholder="XP"><button class="add" id="save">Quest toevoegen</button><button class="cancel" id="close">Annuleren</button></div></div><div class="toast" id="toast"></div></div><script>
const base=[["Ren 3 km","Sport",100,"🏃","speed"],["30 min leren","School",75,"📚","intelligence"],["Kamer opruimen","Huis",50,"🏠","discipline"],["20 push-ups","Sport",30,"💪","strength"],["5.000 stappen","Bewegen",100,"👟","speed"]].map((x,i)=>({id:i+1,name:x[0],cat:x[1],xp:x[2],icon:x[3],stat:x[4]}));let s=JSON.parse(localStorage.ql||"null")||{level:1,xp:0,stats:{strength:1,intelligence:1,speed:1,discipline:1},quests:base};const save=()=>localStorage.ql=JSON.stringify(s),need=()=>s.level*100;
function finish(id){let q=s.quests.find(x=>x.id===id);if(q.done)return;let old=s.level;q.done=1;s.xp+=q.xp;s.stats[q.stat]++;while(s.xp>=need()){s.xp-=need();s.level++}save();render();toast(s.level>old?"🎉 LEVEL UP!":"⚡ +"+q.xp+" XP")}
function row(q){return `<div class="quest ${q.done?"done":""}"><div class="qicon">${q.icon}</div><div class="qmain"><div class="qname">${q.name}</div><div class="muted">${q.cat}</div></div><div class="qxp">+${q.xp}</div><button class="check" onclick="finish(${q.id})">${q.done?"✓":"○"}</button></div>`}
function hero(){return `<section class="hero"><div class="levelrow"><div><div class="kicker">JOUW AVONTUUR</div><div class="level">Level ${s.level} ⚔️</div></div><div class="xp">${s.xp} / ${need()} XP</div></div><div class="bar"><div class="fill" style="width:${s.xp/need()*100}%"></div></div><div class="stats">${[["❤️","Kracht","strength"],["🧠","Intelligentie","intelligence"],["⚡","Snelheid","speed"],["🛡️","Discipline","discipline"]].map(x=>`<div class="stat">${x[0]}<b>${s.stats[x[2]]}</b><small>${x[1]}</small></div>`).join("")}</div></section>`}
function render(t="home"){let m=document.getElementById("main");if(t==="home")m.innerHTML=hero()+"<h2>⚔️ Vandaag</h2>"+s.quests.slice(0,5).map(row).join("")+'<button class="add" onclick="openM()">＋ Eigen quest toevoegen</button>';else if(t==="quests")m.innerHTML='<div class="title">Quests</div>'+s.quests.map(row).join("")+'<button class="add" onclick="openM()">＋ Nieuwe quest</button>';else if(t==="ach")m.innerHTML='<div class="title">Achievements</div>'+[["⭐","Eerste quest",s.quests.some(q=>q.done)],["🏆","Level 5",s.level>=5],["👑","Quest Master",s.quests.filter(q=>q.done).length>=5],["🔥","XP Hunter",s.level>=10]].map(x=>`<div class="panel achievement"><span>${x[0]}</span><div><b>${x[1]}</b><div class="muted">Special achievement</div></div><span class="lock">${x[2]?"✅":"🔒"}</span></div>`).join("");else m.innerHTML='<div class="title">Profiel</div><div class="panel profile"><div class="big">🧙</div><h2>Jouw avonturier</h2><div class="muted">Level '+s.level+" • "+s.quests.filter(q=>q.done).length+" quests voltooid</div></div>";document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.t===t))}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>render(n.dataset.t));function openM(){modal.style.display="flex";qn.focus()}close.onclick=()=>modal.style.display="none";save.onclick=()=>{let n=qn.value.trim(),x=Math.max(1,parseInt(qx.value)||50);if(!n)return;s.quests.push({id:Date.now(),name:n,cat:"Eigen quest",xp:x,icon:"⭐",stat:"discipline"});save();modal.style.display="none";render("quests");toast("⭐ Quest toegevoegd!")};function toast(t){toastEl=document.getElementById("toast");toastEl.textContent=t;toastEl.style.display="block";setTimeout(()=>toastEl.style.display="none",2200)}render();
</script></body></html>
